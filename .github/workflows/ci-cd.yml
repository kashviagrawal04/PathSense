name: PathSense v2 — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/pathsense

jobs:

  # ── 1. Lint & Test ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1 libgl1

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-services.txt -r requirements-vision.txt pytest pytest-cov httpx

      - name: Run tests
        run: pytest tests/ -v --cov=ml --cov=api --cov=services --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  # ── 2. Train & validate model ───────────────────────────────────────────────
  train:
    name: Train model
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ML deps
        run: pip install -r requirements.txt lightgbm

      - name: Train model
        run: python ml/train_v3.py --rows 1000

      - name: Validate model accuracy
        run: |
          python - <<'EOF'
          import json
          with open("ml/artifacts/model_report_v3.json") as f:
              report = json.load(f)
          roc_auc = report["metrics"]["roc_auc"]
          print(f"Model ROC-AUC: {roc_auc:.4f}")
          assert roc_auc >= 0.60, f"Model ROC-AUC {roc_auc:.4f} below minimum 0.60 — refusing deploy"
          print("Model validation passed ✓")
          EOF

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: ml/artifacts/
          retention-days: 30

  # ── 3. Build Docker images ──────────────────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { name: api,      dockerfile: infra/docker/Dockerfile.api }
          - { name: sensor,   dockerfile: infra/docker/Dockerfile.sensor }
          - { name: consumer, dockerfile: infra/docker/Dockerfile.consumer }
          - { name: alert,    dockerfile: infra/docker/Dockerfile.alert }
          - { name: vision,   dockerfile: infra/docker/Dockerfile.vision }
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: ml/artifacts/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Deploy to Kubernetes ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Load local images into Kind
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-sensor:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-consumer:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-alert:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-vision:${{ github.sha }}
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }} --name chart-testing
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-sensor:${{ github.sha }} --name chart-testing
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-consumer:${{ github.sha }} --name chart-testing
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-alert:${{ github.sha }} --name chart-testing
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-vision:${{ github.sha }} --name chart-testing

      - name: Helm upgrade / install
        run: |
          helm upgrade --install pathsense ./infra/k8s/helm/pathsense \
            --namespace pathsense \
            --create-namespace \
            --set global.image.registry=${{ env.REGISTRY }}/${{ github.repository_owner }} \
            --set sensorIngest.image.name=pathsense-sensor \
            --set global.image.tag=${{ github.sha }} \
            --set secrets.openweathermapApiKey="dummy" \
            --set secrets.twilioAccountSid="dummy" \
            --set secrets.twilioAuthToken="dummy" \
            --set secrets.twilioFromNumber="dummy" \
            --set mlArtifacts.enabled=false \
            --set mlArtifacts.accessMode=ReadWriteOnce \
            --set api.autoscaling.enabled=false \
            --set sensorIngest.autoscaling.enabled=false \
            --set api.replicaCount=1 \
            --set sensorIngest.replicaCount=1 \
            --set predictionConsumer.replicaCount=1 \
            --set alertService.replicaCount=1 \
            --set api.resources.requests.cpu=50m,api.resources.requests.memory=128Mi \
            --set sensorIngest.resources.requests.cpu=50m,sensorIngest.resources.requests.memory=128Mi \
            --set predictionConsumer.resources.requests.cpu=50m,predictionConsumer.resources.requests.memory=128Mi \
            --wait \
            --timeout 5m

      - name: Debug cluster on failure
        if: failure()
        run: |
          echo "=== PODS ==="
          kubectl get pods -A
          echo "=== DESCRIBE PODS ==="
          kubectl describe pods -n pathsense
          echo "=== POD LOGS ==="
          for pod in $(kubectl get pods -n pathsense -q -o jsonpath='{.items[*].metadata.name}'); do
            echo "Logs for $pod:"
            kubectl logs $pod -n pathsense || true
          done

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/pathsense-api -n pathsense --timeout=3m
          kubectl rollout status deployment/pathsense-prediction-consumer -n pathsense --timeout=3m

      - name: Smoke test
        run: |
          kubectl port-forward svc/pathsense-api -n pathsense 8000:8000 &
          sleep 5
          curl -sf "http://localhost:8000/" | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok'"
          echo "Smoke test passed ✓"
