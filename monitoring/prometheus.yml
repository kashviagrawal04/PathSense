global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pathsense-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: pathsense-sensor-ingest
    static_configs:
      - targets: ["sensor-ingest:8001"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9092"]

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]
