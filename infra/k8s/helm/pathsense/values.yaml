# PathSense v2 — Helm Chart Values
# Deploy: helm install pathsense ./infra/k8s/helm/pathsense -f values.yaml

global:
  image:
    registry: ghcr.io/yourorg/pathsense
    tag: "2.0.0"
    pullPolicy: IfNotPresent

# ── API service ────────────────────────────────────────────────────────────────
api:
  enabled: true
  image:
    name: pathsense-api
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  service:
    type: ClusterIP
    port: 8000
  livenessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5

# ── Sensor ingest service ──────────────────────────────────────────────────────
sensorIngest:
  enabled: true
  image:
    name: pathsense-sensor-ingest
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    type: ClusterIP
    port: 8001

# ── Prediction consumer (Kafka worker) ─────────────────────────────────────────
predictionConsumer:
  enabled: true
  image:
    name: pathsense-consumer
  replicaCount: 3   # should match Kafka partition count / 2
  # No autoscaling — scale manually based on consumer lag
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  env:
    ALERT_THRESHOLD: "0.70"
    ALERT_COOLDOWN_SEC: "60"

# ── Alert service ──────────────────────────────────────────────────────────────
alertService:
  enabled: true
  image:
    name: pathsense-alert
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

# ── Ingress (nginx) ────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-burst-multiplier: "3"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.pathsense.app
      paths:
        - path: /
          pathType: Prefix
          service: api
          port: 8000
        - path: /ws
          pathType: Prefix
          service: sensor-ingest
          port: 8001
  tls:
    - secretName: pathsense-tls
      hosts:
        - api.pathsense.app

# ── Secrets (use external-secrets or vault in production) ─────────────────────
secrets:
  # These are overridden via --set or sealed-secrets in production
  openweathermapApiKey: ""
  twilioAccountSid: ""
  twilioAuthToken: ""
  twilioFromNumber: ""
  postgresPassword: "changeme_in_prod"
  redisPassword: ""

# ── External services (managed, not deployed by this chart) ───────────────────
kafka:
  external: false   # set true if using Confluent Cloud / MSK
  bootstrapServers: "kafka-headless:9092"

redis:
  external: false   # set true if using Redis Cloud / ElastiCache
  url: "redis://redis-master:6379/0"

postgres:
  external: false
  host: "postgres"
  port: 5432
  database: "pathsense"
  username: "pathsense"

# ── PersistentVolume for ML artifacts ─────────────────────────────────────────
mlArtifacts:
  enabled: true
  storageClass: standard
  size: 2Gi
  # In production, use ReadWriteMany (EFS / NFS) so all pods see same models
  accessMode: ReadOnlyMany
  existingClaim: ""

# ── Monitoring ─────────────────────────────────────────────────────────────────
monitoring:
  serviceMonitor:
    enabled: true   # requires prometheus-operator
    interval: 15s
    path: /metrics
