apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sensor-ingest
  labels:
    app: pathsense-sensor-ingest
    version: {{ .Values.global.image.tag | quote }}
spec:
  replicas: {{ .Values.sensorIngest.replicaCount }}
  selector:
    matchLabels:
      app: pathsense-sensor-ingest
  template:
    metadata:
      labels:
        app: pathsense-sensor-ingest
        version: {{ .Values.global.image.tag | quote }}
    spec:
      containers:
        - name: sensor-ingest
          image: "{{ .Values.global.image.registry }}/{{ .Values.sensorIngest.image.name }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.username }}:{{ .Values.secrets.postgresPassword }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: pathsense-secrets
                  key: openweathermap-api-key
          resources:
            requests:
              cpu: {{ .Values.sensorIngest.resources.requests.cpu | quote }}
              memory: {{ .Values.sensorIngest.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.sensorIngest.resources.limits.cpu | quote }}
              memory: {{ .Values.sensorIngest.resources.limits.memory | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sensor-ingest
  labels:
    app: pathsense-sensor-ingest
spec:
  type: {{ .Values.sensorIngest.service.type }}
  ports:
    - port: {{ .Values.sensorIngest.service.port }}
      targetPort: 8001
      name: http
  selector:
    app: pathsense-sensor-ingest
